AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  WhatsApp Team Draw - sorteio semanal de tarefas (Lambda + DynamoDB + EventBridge Scheduler).
  Somente servicos "Always Free". Spec: specs/001-sorteio-semanal/plan.md

# Todos os valores vem de config/app.properties via scripts/deploy.ps1.
# SEGREDOS NAO PASSAM POR AQUI: o token da Meta e gravado no SSM (SecureString) pelo deploy.

Parameters:
  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: E-mail que recebe o alerta quando a execucao falha (exige confirmar a inscricao).
  ScheduleExpression:
    Type: String
    Default: cron(0 9 ? * MON *)
    Description: Expressao do EventBridge Scheduler (toda segunda as 09:00 no fuso abaixo).
  ScheduleTimezone:
    Type: String
    Default: America/Sao_Paulo
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
  WhatsappApiVersion:
    Type: String
    Default: v25.0
    AllowedPattern: '^v[0-9]+\.[0-9]+$'
  WhatsappPhoneNumberId:
    Type: String
    AllowedPattern: '^[0-9]+$'
    Description: ID do numero de telefone da Cloud API (nao e segredo).
  WhatsappSendMode:
    Type: String
    Default: auto
    AllowedValues: [auto, text, template]
  WhatsappTemplateName:
    Type: String
    Default: ''
    Description: Template utility aprovado (obrigatorio nos modos auto e template).
  WhatsappTemplateLanguage:
    Type: String
    Default: pt_BR
  DrawMaxAttempts:
    Type: Number
    Default: 200
    MinValue: 1
    MaxValue: 5000
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Rules:
  TemplateRequiredWhenNotTextOnly:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref WhatsappSendMode, text]
          - !Not [!Equals [!Ref WhatsappTemplateName, '']]
        AssertDescription: whatsapp.template.name e obrigatorio quando whatsapp.send.mode e auto ou template.

Resources:

  # ---------------------------------------------------------------- Dados
  # DynamoDB provisionado (10/10 de 25 RCU/WCU gratuitas). On-demand, PITR e SSE com KMS
  # proprio ficam de fora: nao estao no free tier. Sem TableName fixo para evitar conflito
  # com a tabela retida caso a stack seja recriada.
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableClass: STANDARD
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 10
        WriteCapacityUnits: 10
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  # ---------------------------------------------------------------- Logs
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-draw'
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------- Alerta
  AlertTopic:
    Type: AWS::SNS::Topic

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------------------------------------------------------------- Lambda
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
              - Sid: Data
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt Table.Arn
              - Sid: WhatsappToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/whatsapp/*'
              - Sid: FailureAlert
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  # O codigo real e publicado por scripts/deploy.ps1 (aws lambda update-function-code),
  # o que dispensa um bucket S3 (S3 so e gratuito por 12 meses). Este stub so existe para
  # a funcao poder ser criada; NAO altere Code.ZipFile, ou o CloudFormation sobrescrevera o codigo.
  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-draw'
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 128
      Timeout: 60
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ACCESS_TOKEN_PARAM: !Sub '/${AWS::StackName}/whatsapp/access-token'
          WA_API_VERSION: !Ref WhatsappApiVersion
          WA_PHONE_NUMBER_ID: !Ref WhatsappPhoneNumberId
          WA_SEND_MODE: !Ref WhatsappSendMode
          WA_TEMPLATE_NAME: !Ref WhatsappTemplateName
          WA_TEMPLATE_LANG: !Ref WhatsappTemplateLanguage
          DRAW_MAX_ATTEMPTS: !Ref DrawMaxAttempts
      Code:
        ZipFile: |
          def handler(event, context):
              raise RuntimeError("Codigo ainda nao publicado: execute scripts/deploy.ps1")

  # O Scheduler invoca a Lambda de forma assincrona: 2 retries e, esgotados, o evento vai ao SNS.
  FunctionAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Function
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !Ref AlertTopic

  # ---------------------------------------------------------------- Agendamento
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt Function.Arn
                  - !Sub '${Function.Arn}:*'

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${AWS::StackName}-weekly'
      Description: Dispara o sorteio semanal de tarefas de todos os times.
      State: !Ref ScheduleState
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt Function.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"action":"weekly"}'
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 3600

Outputs:
  TableName:
    Value: !Ref Table
  FunctionName:
    Value: !Ref Function
  FunctionArn:
    Value: !GetAtt Function.Arn
  AccessTokenParameterName:
    Description: Parametro SSM (SecureString) que scripts/deploy.ps1 preenche com o token da Meta.
    Value: !Sub '/${AWS::StackName}/whatsapp/access-token'
  AlertTopicArn:
    Value: !Ref AlertTopic
  ScheduleName:
    Value: !Ref WeeklySchedule
